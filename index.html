<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>点歌单 · 我的歌单</title>
  <meta name="description" content="主播会唱的歌单，搜索后点歌吧～">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <h1>🎤 点歌单</h1>
        <!-- 改成你自己的直播名 / 昵称 -->
        <p class="subtitle">主播会唱的歌都在这里，搜索后点歌吧～</p>
      </div>
      <div class="controls">
        <div class="search">
          <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
            <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input id="search" type="search" placeholder="搜索歌名 / 歌手" autocomplete="off">
        </div>
        <select id="sort" aria-label="排序方式">
          <option value="default">默认顺序</option>
          <option value="name">按歌名排序</option>
          <option value="artist">按歌手排序</option>
        </select>
        <button id="addBtn" class="btn-primary" type="button">＋ 添加歌曲</button>
      </div>
    </div>
  </header>

  <main>
    <div class="stats">
      <span id="count">共 0 首</span>
      <span id="localCount" class="muted" hidden></span>
    </div>
    <ul id="list" class="song-list"></ul>
    <p id="empty" class="empty" hidden>没有找到匹配的歌曲，换个关键词试试～</p>
  </main>

  <footer class="footer">
    <p>点歌方式：在直播间报「歌名 + 歌手」即可</p>
  </footer>

  <!-- 本地添加歌曲弹窗 -->
  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle">添加歌曲</h2>
      <p class="hint">此处的歌曲只保存在<b>当前浏览器 / 本设备</b>，粉丝看不到，换设备或清缓存会丢失。<br>想要长期更新并同步给粉丝，请编辑 <code>songs.js</code> 文件。</p>
      <label class="field">
        <span>歌曲名 <b class="required">*</b></span>
        <input id="newName" type="text" placeholder="例如：晴天">
      </label>
      <label class="field">
        <span>歌手 / 原唱</span>
        <input id="newArtist" type="text" placeholder="例如：周杰伦">
      </label>
      <div class="modal-actions">
        <button id="cancelBtn" class="btn-ghost" type="button">取消</button>
        <button id="saveBtn" class="btn-primary" type="button">保存</button>
      </div>
    </div>
  </div>

  <script src="songs.js"></script>
  <script src="app.js"></script>
</body>
</html>
